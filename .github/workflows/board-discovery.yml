# Board discovery: finding job boards for each country and role family runs by itself and keeps improving. Each run takes the weakest
# (country, family) cells (the fewest boards with 3+ local jobs; this repo's config/board_priority.txt first among equals: the test profiles' cells),
# asks free sources for candidates (Google sites already found, the AI's memory, Google's free plan last), measures each board and keeps the ones with
# 3+ local jobs. A cell that found nothing rests 1, 2, 4, 8, then 30 days; a fact is read again after 20 days. Engine: jobadabra src/scout_board_cells.py.
# Why (12 Nov 2026, owner, asked via AskUserQuestion: "Separate lab workflow (Recommended)", "Every 2 h (Recommended)", "Stay free for now (Recommended)"):
# the board pass ran inside central-scout.yml for the country with the fewest employers, so countries with no measured board never had a turn; here it
# has its own concurrency group, so it never waits behind the scout's ~22 minutes or replaces its pending run.
# Started every 2 h at :45 UTC by the www Worker's timer (jobadabra-web shared/intel-start.js), never a GitHub cron (late or missed for us); by hand: gh workflow run.
# Its memory is its own (data/boards.sqlite, cache key board-discovery-db-): the scout restores the newest copy read only and publishes its boards in the index
# (board_facts), so neither job saves over the other's memory. The first run starts from the scout's facts and Google memory (SCOUT_BOARD_SEED_DB).
name: Board discovery
run-name: board discovery${{ inputs.country && format(' {0}', inputs.country) || '' }}${{ inputs.cells && format(' {0}', inputs.cells) || '' }}

on:
  workflow_dispatch:
    inputs:
      cells: {description: 'by hand: the cells to read, country:family pairs separated by commas (e.g. sk:nursing_care, si:construction; families from the engine list src/pool_tags.py FAMILIES); empty = the weakest cells', required: false, type: string, default: ''}
      country: {description: 'by hand, the older form: one country (name or code) with kinds of work instead of families; overrides cells', required: false, type: string, default: ''}
      kinds: {description: 'with country: kinds of work, ids from the engine list separated by commas (e.g. trades, education); empty = the next 3 in that country', required: false, type: string, default: ''}
      lanes: {description: 'by hand: countries read side by side in each round (1-8; the engine picks different countries and merges each lane back: jobadabra src/scout_board_lanes.py); empty or 1 = one country at a time, as the timer runs it', required: false, type: string, default: ''}
      browser_final: {description: "job board hosts a trial's headless browser was stopped at (a refusal, a bot check, a sign-in page), separated by commas: kept as stopped before the board pass reads, so a real pass never opens them again (a trial saves no memory)", required: false, type: string, default: ''}
      engine_ref: {description: 'a TRIAL of an unmerged engine change: a branch of the public engine; it reads the real memory and saves nothing. Empty or `main` is the real run', required: false, type: string, default: ''}

concurrency:
  group: ${{ (inputs.engine_ref || 'main') != 'main' && 'board-discovery-trial' || 'board-discovery' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  id-token: write   # the broker knows a run by its OIDC token (desktop/e2e/lib/broker-client.mjs); without it every AI call failed (run 43285176319)

env:
  JOBADABRA_DISABLE: notion,telegram,mail,google_jobs,enrich,score,auto_kits,insights,index   # no user is behind this run
  JOBADABRA_LOCATIONS_FILE: config/central_locations.json

jobs:
  boards:
    runs-on: ubuntu-24.04
    permissions:   # the job's own set replaces the workflow's: the same three, and actions: write only for the last step (it starts the scout)
      contents: read
      actions: write
      id-token: write
    timeout-minutes: 25   # up to 3 passes; each stops starting boards after 4 minutes (src/scout_boards.py BUDGET_S), none starts after minute 13
    env:
      TRIAL: ${{ (inputs.engine_ref || 'main') != 'main' }}
      PYTHONUNBUFFERED: '1'
      SCOUT_MEMORY_URL: https://www.jobadabra.top/api/scout-memory
    steps:
      - name: A trial takes only a branch of our own engine repo
        if: env.TRIAL == 'true'
        env:
          ENGINE_REPO: ${{ vars.OWNER_OF_JOBADABRA }}/jobadabra
          ENGINE_REF: ${{ inputs.engine_ref }}
        run: |
          fail() { echo "::error::engine_ref '$ENGINE_REF' is refused: $1"; exit 1; }
          case "$ENGINE_REF" in
            refs/*|pull/*|*..*|-*|*[!A-Za-z0-9._/-]*) fail "a trial takes the plain name of a branch of $ENGINE_REPO" ;;
          esac
          printf '%s' "$ENGINE_REF" | grep -Eq '^[0-9a-fA-F]{7,40}$' && fail "that is a commit id, not a branch name"
          git ls-remote --exit-code --heads "https://github.com/$ENGINE_REPO" "refs/heads/$ENGINE_REF" > /dev/null || fail "no such branch in $ENGINE_REPO (a tag, a pull request or a fork's branch does not count)"
      - name: The public engine
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.OWNER_OF_JOBADABRA }}/jobadabra
          ref: ${{ inputs.engine_ref || 'main' }}
      - name: This repo (the priority cells)
        uses: actions/checkout@v5
        with:
          path: ops
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Board discovery's own memory
        id: own
        uses: actions/cache/restore@v5
        with:
          path: data/boards.sqlite
          key: board-discovery-db-${{ github.run_id }}
          restore-keys: board-discovery-db-
      # The scout's memory, read only: the AI's cached answers (places, families) and, on the first run, the facts and Google memory to start from. Never saved here.
      - name: The scout's memory (read only)
        id: candidates
        uses: actions/cache/restore@v5
        with:
          path: |
            data/jobs.sqlite
            data/cache
            data/geo.json
          key: central-scout-db-${{ github.run_id }}
          restore-keys: central-scout-db-
      - name: The scout's memory from the site when the cache was not found (read only)
        id: memory-site
        if: steps.candidates.outputs.cache-matched-key == ''
        continue-on-error: true
        timeout-minutes: 3
        env:
          INDEX_PUBLISH_KEY: ${{ secrets.INDEX_PUBLISH_KEY }}
        run: |
          set +e
          if [ -z "$INDEX_PUBLISH_KEY" ]; then echo "::warning::scout memory: not restored from R2 (no INDEX_PUBLISH_KEY)"; exit 0; fi
          zipped="$RUNNER_TEMP/scout-memory.tgz"; errs="$RUNNER_TEMP/scout-memory.err"
          code=$(printf 'header = "Authorization: Bearer %s"\n' "$INDEX_PUBLISH_KEY" | curl -sS -K - --max-time 50 --retry 2 --retry-delay 2 -o "$zipped" -w '%{http_code}' "$SCOUT_MEMORY_URL" 2>"$errs")
          code="${code: -3}"
          if [ "$code" != 200 ]; then echo "scout memory: not restored from R2 (HTTP ${code:-none})"; exit 0; fi
          unpacked=$(mktemp -d)
          if tar -xzf "$zipped" -C "$unpacked" 2>/dev/null && mkdir -p data && cp -a "$unpacked"/. data/; then echo "scout memory: restored from R2"; else echo "::warning::scout memory: the copy did not unpack"; fi
          exit 0
      - name: Install the AI library
        continue-on-error: true
        run: pip install --quiet -r requirements.txt -r requirements-render.txt
      # Why (12 Nov 2026, owner via sa: "Boards now, employers next (Recommended)"): a board the plain reader is refused on is measured once in this honest headless browser.
      - name: Chromium for the board pass's browser read (cached)
        continue-on-error: true
        uses: ./.github/actions/playwright-browser
        with: {runtime: python, mode: both}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Board discovery (the weakest cells' boards)
        id: boards
        env:
          ENGINE_REF: ${{ inputs.engine_ref }}
          SCOUT_BOARD_COUNTRY: ${{ inputs.country }}
          SCOUT_BOARD_KINDS: ${{ inputs.kinds }}
          LANES: ${{ inputs.lanes }}
          SCOUT_BOARD_CELLS: ${{ inputs.cells }}   # read by the engine as data (src/scout_board_cells.py parse keeps known countries and families only)
          SCOUT_BOARD_SEED_DB: data/jobs.sqlite   # the first run starts from the scout's facts, Google's waiting sites and the browser's stops (src/scout_board_cells.py seed)
          # Why (12 Nov 2026, sa for the owner: "Final, never again", "never retry a 401 or 403"; lab#99): a trial saves no memory, so a stop it met in the browser is named here; the hosts stay in this repo's run input, never in the public engine
          SCOUT_BROWSER_FINAL: ${{ inputs.browser_final }}   # read by the engine as data (src/scout_boards.py seed_final keeps host-shaped names only)
          SCOUT_SERPAPI_KEY: ${{ secrets.CENTRAL_SCOUT_SERPAPI_KEY }}   # Google results under their own caps (src/scout_google_boards.py); never as SERPAPI_API_KEY
          # Why (13 Nov 2026, bp; owner via sa, asked via AskUserQuestion: "Any reported board (Recommended)"): the pass also reads the boards installs reported (jobadabra src/scout_board_candidates.py,
          # GET <site>/api/scout-memory?boards=1 with the Scout's own key, host + countries + install count, never an install id). A trial runs an unmerged engine branch, so it never gets the key.
          INDEX_PUBLISH_KEY: ${{ env.TRIAL != 'true' && secrets.INDEX_PUBLISH_KEY || '' }}
        run: |
          grep -q 'def discover' src/scout.py || { echo "::error::engine ref '${ENGINE_REF:-main}' has no board discovery (jobadabra src/scout_board_cells.py)"; exit 1; }
          SCOUT_BOARD_PRIORITY=$(tr -d '\n' < ops/config/board_priority.txt)
          export SCOUT_BOARD_PRIORITY
          cap=$(python -c 'from src.scout_boards import JOB_CALLS; print(JOB_CALLS)')
          echo "board discovery: its own relay, cap $cap AI calls"
          # Why (12 Nov 2026, owner: "Let's make it more efficient", over 11 by-hand runs): a run spent ~2 of its 4-6 minutes on setup for ONE country and
          # used 18-31 of its 71 AI calls; several passes in one job read the next weakest countries on the same setup (each pass keeps its own cap and
          # rests or clears its cells, so the next pick moves on). By hand with cells or a country, and a trial: one pass, as asked.
          set -o pipefail   # a pass that fails must fail the step, not tee's status
          passes=3
          if [ -n "$SCOUT_BOARD_CELLS$SCOUT_BOARD_COUNTRY" ] || [ "$TRIAL" = true ]; then passes=1; fi
          began=$(date +%s)
          # Why (13 Nov 2026, owner: "Maybe we just need to run the Board discovery" "many times in parallel"): one country a pass filled the map too slowly, and two
          # runs at once would save over each other's memory (one cache file). Inside this one run, a round reads several different countries at once, each lane in
          # its own copy of the memory behind its own relay and cap, and the engine copies each lane's own country back. Google's results stay off in a lane (its
          # month count is one number of the whole memory). By hand only; a country or a trial keeps one pass.
          case "$(printf '%s' "$LANES" | tr -d '[:space:]')" in [2-8]) lanes=$(printf '%s' "$LANES" | tr -d '[:space:]') ;; *) lanes=1 ;; esac
          for marker in board-lanes board-merge SCOUT_BOARD_ONLY; do   # an engine without every part of the lanes: one country at a time
            grep -rq -- "$marker" src/scout.py src/scout_board_lanes.py 2>/dev/null || { lanes=1; break; }
          done
          echo "board discovery: lanes=$lanes (asked: '${LANES:-}')"
          failed=0
          # Why (13 Nov 2026, run 43360878796): 5 cells of 5 countries were asked with lanes=4 and only the first country was read (cells keep one pass, and
          # the lanes needed more than one). Cells of several countries now read side by side, one lane a country, in one round; a trial stays one pass.
          cell_codes=$(printf '%s' "$SCOUT_BOARD_CELLS" | tr ',' '\n' | sed 's/:.*//' | tr -d ' \t' | tr 'A-Z' 'a-z' | sed '/^$/d')
          cell_countries=$(printf '%s\n' "$cell_codes" | sed -n '/^[a-z][a-z]$/p' | awk '!seen[$0]++' | tr '\n' ' ')
          not_codes=$(printf '%s\n' "$cell_codes" | sed '/^[a-z][a-z]$/d' | tr '\n' ' ')
          if [ -n "$(printf '%s' "$not_codes" | tr -d ' ')" ]; then echo "::warning::board discovery: cells whose country is not a 2-letter code get no lane: $not_codes"; fi
          by_cells=0
          if [ "$lanes" -gt 1 ] && [ "$TRIAL" != true ] && [ -z "$SCOUT_BOARD_COUNTRY" ] && [ "$(printf '%s' "$cell_countries" | wc -w)" -gt 1 ]; then by_cells=1; fi
          if [ "$lanes" -gt 1 ] && { [ "$passes" -gt 1 ] || [ "$by_cells" = 1 ]; }; then
            for round in $(seq 1 "$passes"); do
              if [ $(( $(date +%s) - began )) -gt 780 ]; then echo "board discovery: round $round not started (13 minutes used)"; break; fi
              if [ "$by_cells" = 1 ]; then
                countries=$(printf '%s' "$cell_countries" | tr ' ' '\n' | head -n "$lanes" | tr '\n' ' ')
                left=$(printf '%s' "$cell_countries" | tr ' ' '\n' | tail -n +"$((lanes + 1))" | tr '\n' ' ')
                if [ -n "$left" ]; then echo "::warning::board discovery: more countries asked than lanes ($lanes); not read this run: $left"; fi
              else
                countries=$(python -m src scout --board-lanes "$lanes" --db data/boards.sqlite | tail -n 1)
              fi
              if [ -z "$countries" ]; then echo "board discovery: nothing to read this round"; break; fi
              echo "board discovery: round $round of $passes, lanes: $countries"
              merges=""; pids=""
              for country in $countries; do
                cp data/boards.sqlite "$RUNNER_TEMP/lane-$country.sqlite"
                # Why (13 Nov 2026, run 43333990879): the engine lets one run at a time into a data folder (src/paths.py run_lock), so six lanes in the one data/
                # ran one after another and Bulgaria's waited 18 minutes for the lock and failed. Each lane gets its own copy of data/ (the read-only AI answers
                # come with it); only its boards memory comes back, through --board-merge.
                rm -rf "$RUNNER_TEMP/data-$country"; cp -a data "$RUNNER_TEMP/data-$country"; rm -f "$RUNNER_TEMP/data-$country/boards.sqlite"
                ( JOBADABRA_DATA_DIR="$RUNNER_TEMP/data-$country" SCOUT_BOARD_ONLY=$country SCOUT_SERPAPI_KEY='' node desktop/e2e/broker-relay-run.mjs --job board-discovery --cap "$cap" -- \
                    python -m src scout --board-pass --db "$RUNNER_TEMP/lane-$country.sqlite" > "$RUNNER_TEMP/lane-$country.log" 2>&1 ) &
                pids="$pids $country:$!"
              done
              # A lane that failed must fail the step (as the one-lane loop does under pipefail), and its copy never comes back; the lanes that ended well are merged first.
              for lane in $pids; do
                country=${lane%%:*}
                if wait "${lane#*:}"; then merges="$merges $country=$RUNNER_TEMP/lane-$country.sqlite"; else echo "::error::board discovery: the lane of $country failed (its log is below); nothing of it is kept"; failed=1; fi
                echo "::group::lane $country"; cat "$RUNNER_TEMP/lane-$country.log"; echo "::endgroup::"
              done
              # shellcheck disable=SC2086 # one argument per lane
              if [ -n "$merges" ]; then python -m src scout --board-merge $merges --db data/boards.sqlite; fi
              if [ "$failed" = 1 ]; then break; fi
              if grep -q '^skipped=true' "$GITHUB_OUTPUT" 2>/dev/null; then echo "board discovery: the AI was refused or failed, no further round"; break; fi
            done
            exit "$failed"
          fi
          for pass in $(seq 1 "$passes"); do
            if [ $(( $(date +%s) - began )) -gt 780 ]; then echo "board discovery: pass $pass not started (13 minutes used)"; break; fi
            echo "board discovery: pass $pass of $passes"
            node desktop/e2e/broker-relay-run.mjs --job board-discovery --cap "$cap" -- python -m src scout --board-pass --db data/boards.sqlite | tee "$RUNNER_TEMP/board-pass.log"
            if grep -q 'nothing to read this run' "$RUNNER_TEMP/board-pass.log"; then break; fi
            if grep -q '^skipped=true' "$GITHUB_OUTPUT" 2>/dev/null; then echo "board discovery: the AI was refused or failed, no further pass"; break; fi
          done
      # Why (12 Nov 2026, owner: "Still getting on old telegram bots"; coordinator): this repo had no SELFHEAL_PUBLISH_KEY secret, so every alert below fell back to the old bot without a word. Say it in the run's annotations.
      - name: The switchboard key is set (else the old CI-alerts bot sends the alerts below)
        if: always()
        env:
          SELFHEAL_PUBLISH_KEY: ${{ secrets.SELFHEAL_PUBLISH_KEY }}
        run: |
          [ -n "$SELFHEAL_PUBLISH_KEY" ] || echo "::warning title=Notifications switchboard key missing::SELFHEAL_PUBLISH_KEY is empty in this repo, so the alerts of this run go to the old CI-alerts bot and no Notifications switch applies. The owner sets it: gh secret set SELFHEAL_PUBLISH_KEY"
      - name: Tell the owner once if Codex refused or a call failed (the AI judgments wait, nothing is paid)
        if: always() && steps.boards.outputs.skipped == 'true'
        uses: ./.github/actions/ai-skipped-alert
        with:
          bot-token: ${{ secrets.CI_ALERTS_TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.CI_ALERTS_TELEGRAM_CHAT_ID }}
          switchboard-key: ${{ secrets.SELFHEAL_PUBLISH_KEY }}
          github-token: ${{ github.token }}
          notes-dir: ${{ runner.temp }}/ai-capped
      - name: Save board discovery's memory (a by-hand run starts the scout below; a timer run waits for the scout's own slots)
        if: always() && env.TRIAL != 'true'
        uses: actions/cache/save@v5
        with:
          path: data/boards.sqlite
          key: board-discovery-db-${{ github.run_id }}
      # Why (13 Nov 2026, sd; sa for the owner, root cause: this run only SAVES its memory and central-scout.yml publishes it in the index on its next start, the Worker's :25 slots of
      # 4, 10, 16, 22 UTC, so by-hand runs that ended green left their counts unserved for hours: apps got 0 counts until bp started the scout by hand at 21:06Z, run 43507746613):
      # a by-hand run (cells or a country given: the same test as the one-pass rule above) that ended green starts the scout itself, and the run says which: "published: run <link>" or
      # "not published: <why>". A timer run never does (12 starts a day instead of 4, ~40 broker calls each); a trial never does (it saves no memory, and engine_ref=main is the real run).
      # Trap: central-scout.yml keeps ONE pending run per concurrency group, so ten by-hand runs in an hour leave one running and one pending scout; the pending one reads the newest
      # memory when it starts, so nothing is lost, and the line says "queued behind run <id>".
      - name: A by-hand run that ended green starts the scout that publishes its boards
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}   # the workspace root is the engine checkout (this repo is at ops/): without it gh would look for central-scout.yml in the engine repo (Gitar on lab#111)
          JOB_STATUS: ${{ job.status }}
          BY_HAND: ${{ inputs.cells }}${{ inputs.country }}
        run: |
          say() { echo "board discovery: $1"; echo "- board discovery: $1" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"; }
          if [ "$TRIAL" = true ]; then say "not published: a trial saves no memory and publishes nothing"; exit 0; fi
          if [ -z "$(printf '%s' "$BY_HAND" | tr -d '[:space:]')" ]; then say "not published: a timer run; the scout's own slots (:25 of 4, 10, 16, 22 UTC) publish its boards"; exit 0; fi
          if [ "$JOB_STATUS" != success ]; then say "not published: the discovery did not end green ($JOB_STATUS)"; exit 0; fi
          lister() { python3 tools/gh_retry.py run list --workflow central-scout.yml --event workflow_dispatch --limit 20 --json databaseId,url --jq '.[] | "\(.databaseId) \(.url)"' 2>/dev/null || true; }
          before=$(lister | cut -d' ' -f1)
          busy=$(python3 tools/gh_retry.py run list --workflow central-scout.yml --status in_progress --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)
          if ! python3 tools/gh_retry.py workflow run central-scout.yml --ref main > "$RUNNER_TEMP/dispatch.out" 2>&1; then
            echo "::warning::board discovery: the scout was not started: $(head -c 300 "$RUNNER_TEMP/dispatch.out" | tr '\n' ' ')"
            say "not published: the scout dispatch was refused ($(head -c 120 "$RUNNER_TEMP/dispatch.out" | tr '\n' ' '))"; exit 0
          fi
          link=""
          for _ in 1 2 3 4 5 6; do   # the run appears in the list a few seconds after the dispatch; the first one that was not listed before it is this one (Gitar on lab#111)
            link=$(lister | while read -r id url; do printf '%s\n' "$before" | grep -qx "$id" || { echo "$url"; break; }; done)
            [ -n "$link" ] && break
            sleep 5
          done
          if [ -z "$link" ]; then say "published: the scout was started (its run was not listed within 30 s)"; exit 0; fi
          if [ -n "$busy" ]; then say "published: run $link (queued behind run $busy; it reads this memory when it starts)"; else say "published: run $link"; fi
